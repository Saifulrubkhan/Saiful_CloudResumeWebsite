version: 0.2

env:
  variables:
    S3_BUCKET: "resume-website-saiful"
    CLOUDFRONT_DISTRIBUTION_ID: "E2ZAVM7W2WEI3R"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - aws s3 sync dist/ s3://$S3_BUCKET --delete
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

artifacts:
  files:
    - "**/*"
  base-directory: dist
